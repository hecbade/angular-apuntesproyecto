<div class="container">
  <div class="row">
    <div class="col s5">
      <div class="card">
        <div class="card-content">
          <form #empleadoForm="ngForm">

            <input
              type="hidden"
              name="_id"
              #_id="ngModel"
              [(ngModel)]="empleadosServices.empleadoSeleccionado.id"
            />

            <div class="row">

              <div class="input-field col s12">
                <input
                  type="text"
                  name="nombre"
                  placeholder="Introduzca su nombre.."
                  #nombre="ngModel"
                  [(ngModel)]="empleadosServices.empleadoSeleccionado.nombre"
                />
              </div>

              <div class="input-field col s12">
                <input
                  type="text"
                  name="cargo"
                  placeholder="Introduzca su cargo.."
                  #cargo="ngModel"
                  [(ngModel)]="empleadosServices.empleadoSeleccionado.cargo"
                />
              </div>

              <div class="input-field col s12">
                <input
                  type="text"
                  name="departamento"
                  placeholder="Introduzca su departamento.."
                  #departamento="ngModel"
                  [(ngModel)]="empleadosServices.empleadoSeleccionado.departamento"
                />
              </div>

              <div class="input-field col s12">
                <input
                  type="text"
                  name="salario"
                  placeholder="Introduzca su salario.."
                  #salario="ngModel"
                  [(ngModel)]="empleadosServices.empleadoSeleccionado.salario"
                />
              </div>
              <div class="card_action">
                <div class="btn right" (click)="resetForm()">Reset</div>
                <div class="btn right" (click)="addEmployee()">Añadir empleado</div>
              </div>

            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col s7"></div>
  </div>
</div>
